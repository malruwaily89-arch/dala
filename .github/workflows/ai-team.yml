name: AI team policy tests
on:
  pull_request:
    paths: ['ai-team/**', '.github/workflows/ai-team.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test ai-team/test/*.test.mjs
      - run: node ai-team/src/cli.mjs ai-team/examples/evidence.json
